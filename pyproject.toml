[project]
name = "botfragg"
version = "1.0.0"
description = "A privacy-conscious VALORANT companion for Discord"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = [
    "aiohttp>=3.13.0",
    "cryptography>=50.0.1",
    "discord-py>=2.7.1",
    "jishaku[procinfo]>=2.7.5",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "sentry-sdk>=2.52.0",
    "tortoise-orm[asyncpg]>=1.1.8",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.14.0",
]

[project.scripts]
botfragg = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "assets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "S", "UP", "SIM", "I", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `assert` is pytest's standard assertion syntax.
"tests/**/*.py" = ["S101"]
# These assertions narrow callback item types before accessing their attributes.
"src/views/components.py" = ["S101"]
# Keep historical Tortoise migrations unchanged.
"src/migrations/*.py" = ["I001", "RUF012"]

[tool.ruff.format]
exclude = ["src/migrations/*.py"]
